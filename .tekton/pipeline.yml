apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-final
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: eslint
      runAfter: [git-clone]
      taskRef:
        name: validate-source
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: jest
      runAfter: [eslint]
      taskRef:
        name: unit-tests
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: buildah
      runAfter: [jest]
      taskRef:
        name: buildah
      params:
        - name: image-tag
          value: $(context.pipelineRun.name)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: deploy-application
      params:
        - name: image
          value: $(tasks.buildah.results.image)
      workspaces:
        - name: source
          workspace: shared-workspace
