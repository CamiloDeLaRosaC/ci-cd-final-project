apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: oc-final-
spec:
  pipelineRef:
    name: oc-final
  taskRunTemplate:
    serviceAccountName: ci-cd-pipeline
  timeouts:
    pipeline: 30m
  params:
    - name: repo-url
      value: ''
    - name: revision
      value: main
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: oc-pipelines-pvc
