apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.49.1
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        case "$REPO_URL" in https://github.com/*) ;; *) echo 'A real HTTPS GitHub URL is required'; exit 1;; esac
        if [ ! -d source/.git ]; then
          git clone -- "$REPO_URL" source
        fi
        cd source
        git config --global --add safe.directory "$PWD"
        test "$(git remote get-url origin)" = "$REPO_URL"
        git fetch origin "$REVISION"
        git checkout --detach FETCH_HEAD
        git rev-parse HEAD
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-source
spec:
  workspaces:
    - name: source
  steps:
    - name: eslint-and-manifests
      image: node:24-alpine
      workingDir: $(workspaces.source.path)/source
      env:
        - name: HOME
          value: /tmp
        - name: NPM_CONFIG_CACHE
          value: /tmp/npm-cache
      script: |
        #!/bin/sh
        set -eu
        npm ci --no-audit --no-fund
        npm run lint
        npm run validate
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: image-tag
      type: string
  workspaces:
    - name: source
  results:
    - name: image
      description: Built image reference including digest
  volumes:
    - name: registry-auth
      emptyDir: {}
  steps:
    - name: registry-credentials
      image: quay.io/openshift/origin-cli:4.18
      volumeMounts:
        - name: registry-auth
          mountPath: /auth
      script: |
        #!/bin/sh
        set -eu
        umask 077
        oc whoami -t > /auth/token
    - name: build-and-push
      image: registry.redhat.io/rhel8/buildah:latest
      workingDir: $(workspaces.source.path)/source
      securityContext:
        runAsUser: 0
      env:
        - name: REGISTRY
          value: image-registry.openshift-image-registry.svc:5000
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/ci-cd-final-project:$(params.image-tag)
      volumeMounts:
        - name: registry-auth
          mountPath: /auth
      script: |
        #!/bin/sh
        set -eu
        trap 'rm -f /auth/token /auth/registry.json' EXIT
        buildah login --authfile /auth/registry.json --username serviceaccount \
          --password-stdin "$REGISTRY" < /auth/token
        buildah --storage-driver=vfs bud --isolation=chroot -f Dockerfile -t "$IMAGE" .
        buildah --storage-driver=vfs push --authfile /auth/registry.json \
          --digestfile /tmp/image-digest "$IMAGE" "docker://$IMAGE"
        printf '%s@%s' "${IMAGE%:*}" "$(cat /tmp/image-digest)" > "$(results.image.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-application
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: rollout-and-health
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)/source
      env:
        - name: APP_IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        oc apply -f k8s/application.yml
        oc set image deployment/ci-cd-final-project catalog="$APP_IMAGE"
        oc rollout status deployment/ci-cd-final-project --timeout=180s
        oc exec deployment/ci-cd-final-project -- node -e \
          'fetch("http://127.0.0.1:8000/health").then(async r => {if (!r.ok || (await r.json()).status !== "ok") process.exit(1); console.log("Health OK");}).catch(() => process.exit(1))'
        oc logs deployment/ci-cd-final-project --tail=100
